<!DOCTYPE html>
<html lang="fr">

<!-- HEAD -->

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minifigs | BrickV3rse</title>
    <link rel="icon" type="image/png" href="img/logo_actuel.png">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CGB36SQTVF"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-CGB36SQTVF');
    </script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="apple-touch-icon" href="img/logo_actuel.png">
</head>

<body>
    <!-- HEADER -->

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="title">
            <H1 data-key="title_minifigs"></H1>
        </div>
        <div class="separator"></div>

        <!-- TRI / FILTRE -->
        <div style="display:flex;gap:1rem;flex-wrap:wrap">
            <!-- TRI -->
            <div class="dropdown-tri" id="sort-dropdown">
                <button class="dropbtn-tri" id="sort-btn">
                    <span id="sort-label" data-key="sort_relevance"></span>
                    <span class="arrow-down">&#9662;</span>
                </button>
                <div class="dropdown-content-tri" id="sort-options">
                    <a href="#" data-sort="name-asc" data-key="sort_name_asc"></a>
                    <a href="#" data-sort="name-desc" data-key="sort_name_desc"></a>
                    <a href="#" data-sort="relevance" data-key="sort_relevance"></a>
                </div>
            </div>

            <!-- FILTRE -->
            <div class="dropdown-tri" id="filter-dropdown">
                <button id="filter-btn" class="dropbtn-tri">
                    <span id="filter-label" data-key="filter_all_label"></span>
                    <span class="arrow-down">&#9662;</span>
                </button>
                <div id="filter-options" class="dropdown-content-tri"></div>
            </div>
        </div>

        <!-- Modal tri (mobile) -->
        <div id="sort-modal" class="sort-modal">
            <div class="sort-modal-content">
                <button class="close-sort-modal" aria-label="Fermer">×</button>
                <a href="#" data-sort="name-asc" data-key="sort_name_asc"></a>
                <a href="#" data-sort="name-desc" data-key="sort_name_desc"></a>
                <a href="#" data-sort="relevance" data-key="sort_relevance"></a>
            </div>
        </div>

        <!-- Modal FILTRE (mobile) -->
        <div id="filter-modal" class="sort-modal">
            <div class="sort-modal-content">
                <button class="close-sort-modal" aria-label="Fermer">×</button>
                <div id="filter-list" class="checkbox-list"></div>
                <a href="#" id="reset-filters" data-key="action_reset_filters"></a>
                <a href="#" id="apply-filters" data-key="action_apply_filters"></a>
            </div>
        </div>

        <section id="figures-container"></section>
    </main>

    <!-- FOOTER -->

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/Generator.js"></script>
    <script src="js/script.js"></script>
    <script src="js/translations.js"></script>

    <!-- Spécifique Minifigs : rendu + (re)construction du FILTRE après génération -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const src = window.PROJECTS || window.project || [];
            const figures = src.filter(p => (p.type || '').trim().toLowerCase() === 'minifig');

            window.CardGenerator.generateMinifigs({
                items: figures,
                containerId: "figures-container",
                filterSelectId: "film-filter",
                lang: window.currentLang || "en"
            });

            // >>> reconstruit l’UI des filtres une fois les cartes présentes
            if (typeof buildfilterFilterUI === "function") {
                buildfilterFilterUI();
                applyfilterFilter();
            }
        });
    </script>

    <!-- Hook i18n pour mettre à jour les textes des cartes minifigs -->
    <script>
        (function () {
            const prev = window.setLanguage;
            window.setLanguage = function (lang) {
                prev?.(lang);
                window.CardGenerator.updateMinifigTextsFromNames(lang);
                // (re)construire l’UI des filtres dans la bonne langue
                if (typeof buildfilterFilterUI === "function") {
                    buildfilterFilterUI();
                    applyfilterFilter();
                }
            };
            // sync initiale
            window.CardGenerator.updateMinifigTextsFromNames(window.currentLang || "en");
        })();
    </script>

</body>

</html>
