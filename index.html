<!DOCTYPE html>
<html lang="fr">

<!-- HEAD -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home | Bricks Creations</title>
  <link rel="icon" type="image/png" href="img/logo_actuel.png">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CGB36SQTVF"></script>

<body>
  <!-- HEADER -->


  <!-- MAIN -->
  <main class="main-content">
    <!-- HERO -->
    <h1 data-key="site_title">BRICKS CREATIONS</h1>

    <div class="separator"></div>

    <!-- ===== Rangée 1 : MOC (ALL) + Minifigs (côte à côte sur PC) ===== -->
    <div class="section-row">
      <!-- MOC (ALL) -->
      <section aria-labelledby="sec-latest-all" class="grid-3 section-card" data-limit="2">
        <div class="section-head">
          <h2 id="sec-latest-all">MOCs</h2>
        </div>
        <div class="MOC-grid" id="grid-latest-all"></div>
        <div class="section-actions">
          <a class="btn-ghost" href="MOC.html?theme=all" data-key="see_all">Voir plus</a>
        </div>
      </section>

      <!-- Instructions -->
      <section aria-labelledby="sec-latest-instructions" class="grid-3 section-card" data-limit="2">
        <div class="section-head">
          <h2 id="sec-latest-instructions">Instructions</h2>
        </div>
        <div class="MOC-grid" id="grid-latest-instructions"></div>
        <div class="section-actions">
          <a class="btn-ghost" href="Instructions.html" data-key="see_all">Voir plus</a>
        </div>
      </section>
    </div>

    <!-- Minifigs -->

    <section aria-labelledby="sec-latest-minifigs" class="grid-3 section-card" data-limit="5">
      <div class="section-head">
        <h2 id="sec-latest-minifigs" data-key="minifigs">Minifigs</h2>
      </div>
      <div class="MOC-grid" id="grid-latest-minifigs"></div>
      <div class="section-actions">
        <a class="btn-ghost" href="Minifigs.html" data-key="see_all">Voir plus</a>
      </div>
    </section>


    <div class="section-row">

      <!-- MOC Jurassic Park -->
      <section aria-labelledby="sec-latest-jp" class="grid-3 section-card" data-limit="2">
        <div class="section-head">
          <h2 id="sec-latest-jp">MOCs Jurassic Park</h2>
        </div>
        <div class="MOC-grid" id="grid-latest-jp"></div>
        <div class="section-actions">
          <a class="btn-ghost" href="MOC.html?theme=jurassic-park" data-key="see_all">Voir plus</a>
        </div>
      </section>


      <!-- MOC Marvel -->
      <section aria-labelledby="sec-latest-marvel" class="grid-3 section-card" data-limit="2">
        <div class="section-head">
          <h2 id="sec-latest-marvel">MOCs Marvel</h2>
        </div>
        <div class="MOC-grid" id="grid-latest-marvel"></div>
        <div class="section-actions">
          <a class="btn-ghost" href="MOC.html?theme=marvel" data-key="see_all">Voir plus</a>
        </div>
      </section>
    </div>

    <!-- Technics-->
    <section aria-labelledby="sec-latest-technics" class="grid-3 section-card" data-limit="3">
      <div class="section-head">
        <h2 id="sec-latest-technics">Technics</h2>
      </div>

      <div class="MOC-grid" id="grid-latest-technics"></div>
      <div class="section-actions">
        <a class="btn-ghost" href="Technics.html" data-key="see_all">Voir plus</a>
      </div>
    </section>
    </div>

    <!-- Template générique -->
    <template id="card-template">
      <a class="MOC-card">
        <img alt="">
        <h3><span data-key=""></span><span class="date"></span></h3>
      </a>
    </template>

    <noscript>
      <p style="margin-top:1rem;color:#777">Cette page est dynamique et nécessite JavaScript.</p>
    </noscript>
  </main>

  <!-- FOOTER -->

  <!-- Scripts existants -->
  <script src="js/data.js"></script>
  <script src="js/Generator.js"></script>
  <script src="js/script.js"></script>

  <!-- Hydratation Home -->
  <script>
    (function () {
      const ALL = (window.PROJECTS || window.project || []);
      const norm = s => (s || "").trim().toLowerCase();
      const byDateDesc = (a, b) => new Date(b.date || 0) - new Date(a.date || 0);

      const pickLatest = (predicate, limit = 3) =>
        ALL.filter(predicate).sort(byDateDesc).slice(0, limit);

      function renderSection(gridId, predicate, isMinifig = false) {
        const section = document.getElementById(gridId)?.closest('section');
        if (!section) return;
        const limit = parseInt(section.dataset.limit, 10) || 3;
        const items = pickLatest(predicate, limit);

        if (!items.length) { section.remove(); return; }

        if (isMinifig) {
          CardGenerator.generateMinifigs({ items, containerId: gridId, lang: window.currentLang || 'fr' });
        } else {
          CardGenerator.generateCards({ items, containerId: gridId, templateId: 'card-template', lang: window.currentLang || 'fr' });
        }
      }

      // Sections : ALL MOC + Minifigs (côte à côte)
      renderSection('grid-latest-all', p => norm(p.type) === 'moc');
      renderSection('grid-latest-minifigs', p => norm(p.type) === 'minifig', true);

      // Rangée 2 : Instructions + Technics
      renderSection('grid-latest-instructions', p => norm(p.type) === 'instruction' || (typeof p.id === 'string' && p.id.startsWith('instruction')));
      renderSection('grid-latest-technics', p => norm(p.type) === 'technics');

      // Sections : Marvel + Jurassic park (côte à côte)
      renderSection('grid-latest-jp', p => norm(p.type) === 'moc' && norm(p.theme) === 'jurassic-park');
      renderSection('grid-latest-marvel', p => norm(p.type) === 'moc' && norm(p.theme) === 'marvel');


      // i18n
      const prev = window.setLanguage;
      window.setLanguage = function (lang) {
        prev?.(lang);
        CardGenerator.updateCardTitlesFromNames?.(lang);
        CardGenerator.updateMinifigTextsFromNames?.(lang);
      };
      CardGenerator.updateCardTitlesFromNames?.(window.currentLang || 'fr');
      CardGenerator.updateMinifigTextsFromNames?.(window.currentLang || 'fr');
    })();
  </script>

</body>

</html>
