<!DOCTYPE html>
<html lang="fr">

<!-- HEAD -->

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home | Bricks Creations</title>
    <link rel="icon" type="image/png" href="img/logo_actuel.png">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CGB36SQTVF"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-CGB36SQTVF');
    </script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="apple-touch-icon" href="img/logo_actuel.png">
</head>

<body>
    <!-- HEADER -->

    <!-- MAIN -->
    <div class="main-content">
        <div class="title">
            <H1>BUILDING INSTRUCTIONS</H1>
        </div>

        <div class="separator"></div>

        <section class="MOC-grid" id="MOC-grid"></section>

        <template id="card-template">
            <a class="MOC-card">
                <img alt="">
                <h3>
                    <span data-key=""></span>
                    <span class="date"></span>
                </h3>
            </a>
        </template>
    </div>

    <!-- FOOTER -->


    <!-- Scripts -->
    <!-- 1) Données -->
    <script src="js/data.js"></script>

    <!-- 2) Générateurs communs (MOC + minifigs + instructions) -->
    <script src="js/Generator.js"></script>

    <!-- 3) Script commun (menu, i18n, tri, etc.) -->
    <script src="js/script.js"></script>

    <!-- 4) Spécifique à la page Instructions -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const src = window.PROJECTS || window.project || [];
            window.CardGenerator.generateInstructions({
                items: src,
                containerId: "MOC-grid",
                templateId: "card-template",
                lang: window.currentLang || "en"
            });
        });

        // Bascule de langue : met à jour titres + dates
        (function () {
            const prev = window.setLanguage;
            window.setLanguage = function (lang) {
                prev?.(lang);
                window.CardGenerator.updateInstructionTitlesFromNames(lang);
                if (typeof sortMOC === "function") sortMOC();
            };

            // Sync initiale (si la page démarre en FR)
            window.CardGenerator.updateInstructionTitlesFromNames(window.currentLang || "en");
        })();
    </script>
</body>

</html>
