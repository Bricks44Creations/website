<!DOCTYPE html>
<html lang="fr">

<!-- HEAD -->

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instructions | Bricks Creations</title>
    <link rel="icon" type="image/png" href="img/logo_actuel.png">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CGB36SQTVF"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-CGB36SQTVF');
    </script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="apple-touch-icon" href="img/logo_actuel.png">
</head>

<body>
    <!-- HEADER -->

    <!-- MAIN -->
    <div class="main-content">
        <div class="title">
            <H1>BUILDING INSTRUCTIONS</H1>
        </div>

        <div class="separator"></div>

        <!-- TRI / FILTRE -->
        <div style="display:flex;gap:1rem;flex-wrap:wrap">
            <!-- TRI -->
            <div class="dropdown-tri" id="sort-dropdown">
                <button class="dropbtn-tri" id="sort-btn">
                    <span id="sort-label" data-key="sort_difficulty_asc">Trier par : Nom A-Z</span>
                    <span class="arrow-down">&#9662;</span>
                </button>
                <div class="dropdown-content-tri" id="sort-options">
                    <a href="#" data-sort="name-asc" data-key="sort_name_asc">Nom A-Z</a>
                    <a href="#" data-sort="name-desc" data-key="sort_name_desc">Nom Z-A</a>
                    <a href="#" data-sort="difficulty-asc" data-key="sort_difficulty_asc">Difficulté (facile →
                        difficile)</a>
                    <a href="#" data-sort="difficulty-desc" data-key="sort_difficulty_desc">Difficulté (difficile →
                        facile)</a>
                </div>
            </div>

            <!-- FILTRE -->
            <div class="dropdown-tri" id="filter-dropdown">
                <button id="filter-btn" class="dropbtn-tri">
                    <span id="filter-label" data-key="filter_all_label">Filtrer par : Tous</span>
                    <span class="arrow-down">&#9662;</span>
                </button>
                <div id="filter-options" class="dropdown-content-tri"></div>
            </div>
        </div>

        <!-- Modal tri (mobile) -->
        <div id="sort-modal" class="sort-modal">
            <div class="sort-modal-content">
                <button class="close-sort-modal" aria-label="Fermer">×</button>
                <a href="#" data-sort="name-asc" data-key="sort_name_asc">Nom A-Z</a>
                <a href="#" data-sort="name-desc" data-key="sort_name_desc">Nom Z-A</a>
                <a href="#" data-sort="difficulty-asc" data-key="sort_difficulty_asc">Difficulté (facile →
                    difficile)</a>
                <a href="#" data-sort="difficulty-desc" data-key="sort_difficulty_desc">Difficulté (difficile →
                    facile)</a>
            </div>
        </div>

        <!-- Modal FILTRE (mobile) -->
        <div id="filter-modal" class="sort-modal">
            <div class="sort-modal-content">
                <button class="close-sort-modal" aria-label="Fermer">×</button>

                <!-- Liste des cases -->
                <div id="filter-list" class="checkbox-list"></div>

                <!-- Boutons (mêmes styles que la modale tri) -->
                <a href="#" id="reset-filters" data-key="action_reset_filters">Réinitialiser les filtres</a>
                <a href="#" id="apply-filters" data-key="action_apply_filters">Appliquer les filtres</a>


            </div>
        </div>

        <section class="MOC-grid" id="MOC-grid"></section>

        <template id="card-template">
            <a class="MOC-card">
                <img alt="">
                <h3>
                    <span data-key=""></span>
                    <span class="date"></span>
                </h3>
            </a>
        </template>
    </div>

    <!-- FOOTER -->

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/Generator.js"></script>
    <script src="js/script.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1) Source des données
            const src = window.PROJECTS || window.project || [];

            // 2) Filtre: uniquement les "instruction"
            const items = src.filter(p =>
                (p.type || "").toLowerCase() === "instruction" ||
                (typeof p.id === "string" && p.id.startsWith("instruction"))
            );

            // 3) Génération des cartes (titre, image, date, etc.)
            //    -> s'appuie sur Generator.js, comme aujourd'hui
            window.CardGenerator.generateInstructions({
                items: src,
                containerId: "MOC-grid",
                templateId: "card-template",
                lang: window.currentLang || "en"
            });
            // ✅ AJOUT ICI
            if (typeof buildfilterFilterUI === "function") {
                buildfilterFilterUI();
                applyfilterFilter();
            }
            // 4) Recâbler chaque carte vers le PDF provenant de data.js (champ href)
            try {
                const grid = document.getElementById("MOC-grid");
                if (!grid) return;

                const byId = new Map(items.map(p => [p.id, p])); // accès rapide par id

                grid.querySelectorAll(".MOC-card").forEach(a => {
                    // Le href mis par défaut pointe vers detail-moc.html?id=...
                    // On lit l'id et on le remplace par le PDF de data.js
                    const url = new URL(a.href, location.href);
                    const id = url.searchParams.get("id") || "";
                    const it = byId.get(id);

                    // IMPORTANT: dans ton data.js, le PDF est dans "href"
                    const pdf = it?.href;
                    if (pdf) {
                        a.href = pdf;
                        a.target = "_blank";
                        a.rel = "noopener noreferrer";
                    }
                });
            } catch (e) {
                console.warn("Instruction PDF linking failed:", e);
            }
        });


        // Bascule de langue (on conserve ton comportement existant)
        (function () {
            const prev = window.setLanguage;
            window.setLanguage = function (lang) {
                prev?.(lang);
                window.CardGenerator.updateInstructionTitlesFromNames(lang);
                if (typeof sortInstructions === "function") sortInstructions();
            };


        })();
    </script>



</body>

</html>
