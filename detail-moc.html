<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOC | Bricks Creations</title>
    <link rel="icon" type="image/png" href="img/logo_actuel.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Ajustements locaux (on s'appuie au max sur styles.css) */
        .page-header {
            max-width: 1200px;
            margin: 1.5rem auto 0;
            padding: 0 1rem;
        }

        .breadcrumbs {
            display: flex;
            gap: .5rem;
            align-items: center;
            color: #6b7280;
            font-size: .95rem;
        }

        .breadcrumbs a {
            color: var(--brand-blue);
            text-decoration: none;
        }

        .hero-title {
            margin: .4rem 0 0;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            color: var(--brand-title);
            font-weight: 800;
        }

        .main-split {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 1.25rem auto 3rem;
            padding: 0 1rem;
        }

        @media (max-width: 1024px) {
            .main-split {
                grid-template-columns: 1fr;
            }

            .refs {
                position: relative;
                top: auto;
            }
        }

        .refs {
            position: sticky;
            top: 90px;
            align-self: start;
            background: var(--surface);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .refs-header {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: 1rem 1.1rem;
            background: linear-gradient(180deg, #fff, #f9fafc);
            border-bottom: 1px solid #eef1f6;
        }

        .refs h3 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--brand-blue);
        }

        .ref-list {
            padding: 1rem 1.1rem;
            display: grid;
            gap: .65rem;
            color: var(--ink);
        }

        .ref-item {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: .5rem;
        }

        .ref-key {
            font-weight: 700;
            color: var(--brand-blue);
        }

        .card {
            background: var(--surface);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .card+.card {
            margin-top: 1rem;
        }

        .card-body {
            padding: 1rem 1.1rem 1.25rem;
            color: var(--ink);
        }

        .card h2 {
            color: var(--brand-title);
            margin: .2rem 0 1rem;
        }

        .hero-media {
            overflow: hidden;
            border-radius: 14px;
            box-shadow: var(--shadow);
            background: var(--surface);
        }

        .hero-media img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Galerie masonry + lightbox (styles.css fournit déjà .gallery mais on spécialise le détail) */
        .gallery.grid {
            column-count: 3;
            column-gap: 1rem;
        }

        .gallery.grid figure {
            break-inside: avoid;
            margin: 0 0 1rem;
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
        }

        .gallery.grid img {
            width: 100%;
            display: block;
            transition: transform .3s ease;
            cursor: zoom-in;
        }

        .gallery.grid figure:hover img {
            transform: scale(1.03);
        }

        .gallery.grid figcaption {
            position: absolute;
            left: 8px;
            bottom: 8px;
            background: rgba(0, 0, 0, .55);
            color: #fff;
            font-size: .78rem;
            padding: .25rem .5rem;
            border-radius: 6px;
        }

        @media (max-width:1024px) {
            .gallery.grid {
                column-count: 2;
            }
        }

        @media (max-width:640px) {
            .gallery.grid {
                column-count: 1;
            }
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .85);
            z-index: 9999;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 82vh;
            border-radius: 12px;
        }

        .lightbox .close,
        .lightbox .nav {
            position: absolute;
            top: 20px;
            color: #fff;
            border: none;
            background: transparent;
            font-size: 2rem;
            cursor: pointer;
        }

        .lightbox .close {
            right: 24px;
        }

        .lightbox .nav {
            top: 50%;
            transform: translateY(-50%);
        }

        .lightbox .prev {
            left: 24px;
        }

        .lightbox .next {
            right: 24px;
        }

        .credits-bar {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-top: .75rem;
        }

        .chip {
            background: var(--muted);
            border: 1px solid #eaeef6;
            padding: .4rem .65rem;
            border-radius: 999px;
            font-size: .95rem;
        }

        .cta-row {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-top: .5rem;
        }

        .cta-row a {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            text-decoration: none;
            background: var(--brand-blue);
            color: #fff;
            padding: .55rem .75rem;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .12);
        }

        .cta-row a:hover {
            background: var(--brand-accent);
            color: var(--brand-blue);
        }
    </style>
</head>

<body>


    <!-- PAGE HEADER -->
    <!-- ===== MAIN (même structure que witches-road.html) ===== -->
    <div class="main-content project-page">
        <div class="title">
            <h1 id="page-title">Titre</h1>
        </div>

        <div class="separator"></div>

        <!-- HERO: image principale + encart références -->
        <section class="project-hero" aria-label="Présentation du projet">
            <section class="project-gallery" aria-label="Galerie d'images">
                <div class="carousel" aria-roledescription="carrousel">
                    <div class="carousel-track" id="carouselTrack"></div>
                    <button class="carousel-btn prev" aria-label="Image précédente" id="prevBtn"><i
                            class='bx bx-chevron-left'></i></button>
                    <button class="carousel-btn next" aria-label="Image suivante" id="nextBtn"><i
                            class='bx bx-chevron-right'></i></button>
                    <div class="carousel-dots" id="carouselDots" aria-hidden="true"></div>
                </div>
                <div class="thumbs" id="thumbs"></div>
            </section>

            <aside class="project-meta" aria-label="Informations principales">
                <h3 class="meta-title">Références</h3>
                <div class="ref-image">
                    <img id="ref-img" alt="Image de référence">
                    <span class="ref-caption">Image de référence</span>
                </div>
                <div class="meta-grid" id="meta-grid"></div>
            </aside>
        </section>

        <!-- GALERIE / CARROUSEL -->


        <section class="project-video" aria-label="Vidéo du projet">
            <h2>Vidéo</h2>
            <div class="video-wrapper">
                <iframe id="video-frame" frameborder="0" allowfullscreen loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
                </iframe>
            </div>
        </section>

        <!-- DESCRIPTION -->
        <section class="project-description">
            <h2>Description</h2>
            <p id="desc"></p>
        </section>
    </div>

    <!-- DATA -->
    <script src="js/data-detail.js"></script>
    <script src="js/data.js"></script>
    <!-- UTILS (langue, menus, tri, etc.) -->
    <script src="js/Generator.js"></script>
    <script src="js/script.js"></script>

    <script>
        (function () {
            // --- helpers ---
            const $ = (s) => document.querySelector(s);
            const curLang = (window.currentLang || 'fr');
            const fmtDate = (iso) => {
                if (!iso) return '';
                const d = new Date(iso);
                return isNaN(d) ? '' : d.toLocaleDateString(curLang === 'fr' ? 'fr-FR' : 'en-GB');
            };
            const getName = (p) => {
                if (!p) return '';
                if (p.name && typeof p.name === 'object') return p.name[curLang] || p.name.en || p.name.fr || '';
                return p.label || p.alt || p.id || '';
            };

            // --- lire l'id dans l'URL ---
            const params = new URLSearchParams(location.search);
            const mocId = params.get('id');

            // --- données ---
            const PROJECTS = (window.PROJECTS || window.project || []);
            const DETAILS = (window.dataDetails || []);
            const p = (Array.isArray(PROJECTS) ? PROJECTS : []).find(x => x.id === mocId) || {};
            const d = (Array.isArray(DETAILS) ? DETAILS : []).find(x => x.id === mocId) || {};

            // --- remplir titre + description ---
            const title = getName(p) || (d.title && (d.title[curLang] || d.title.en || d.title.fr)) || (mocId || '');
            $('#page-title').textContent = title;

            const desc = (d.description && (d.description[curLang] || d.description.en || d.description.fr)) || '';
            $('#desc').textContent = desc;

            // --- images principale & référence ---
            const mainImg = (d.images && d.images.main) || p.img || '';
            const refImg = (d.images && (d.images.reference || d.images.main)) ||
                (Array.isArray(d.images && d.images.gallery) && d.images.gallery[0] ? d.images.gallery[0].src : '');

            const hero = $('#hero-img'); if (hero) { hero.src = mainImg; hero.alt = title; }
            const ref = $('#ref-img'); if (ref) { ref.src = refImg || ''; ref.alt = title + ' — référence'; }

            // --- aside "Références" (même esprit que witches-road) ---
            const rows = [];
            if (d.locations) rows.push({ icon: 'bx bx-map', key: 'Location :', val: d.locations });
            if (p.filter) rows.push({ icon: 'bx bx-film', key: 'Movie :', val: p.filter });
            if (d.characters) rows.push({ icon: 'bx bx-user', key: 'Characters :', val: d.characters });

            $('#meta-grid').innerHTML = rows.map(r => `
    <div class="meta-row"><i class='${r.icon}'></i><span class="meta-key">${r.key}</span><span>${r.val || '-'}</span></div>
  `).join('');

            // --- galerie/carrousel (dyn) ---
            const gallery = (d.images && Array.isArray(d.images.gallery)) ? d.images.gallery : [];
            const track = $('#carouselTrack');
            const dots = $('#carouselDots');
            const thumbs = $('#thumbs');

            // slides
            track.innerHTML = gallery.map(g => `
    <div class="carousel-slide"><img src="${g.src}" alt="${title} - ${g.caption || ''}"/></div>
  `).join('');

            // thumbs
            thumbs.innerHTML = gallery.map((g, i) => `
    <button ${i === 0 ? 'class="active"' : ''} data-index="${i}">
      <img src="${g.src}" alt="Miniature ${i + 1}"/>
    </button>
  `).join('');

            // dots
            dots.innerHTML = gallery.map((_, i) => `
    <button class="carousel-dot ${i === 0 ? 'active' : ''}" aria-label="Aller à l'image ${i + 1}"></button>
  `).join('');

            // interactions (copiées/simplifiées depuis witches-road)
            let index = 0;
            function update() {
                track.style.transform = `translateX(-${index * 100}%)`;
                // dots
                dots.querySelectorAll('.carousel-dot').forEach((b, i) => b.classList.toggle('active', i === index));
                // thumbs
                thumbs.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === index));
            }
            function goTo(i) { index = (i + gallery.length) % gallery.length; update(); }

            $('#prevBtn')?.addEventListener('click', () => goTo(index - 1));
            $('#nextBtn')?.addEventListener('click', () => goTo(index + 1));
            dots.addEventListener('click', (e) => {
                const i = [...dots.children].indexOf(e.target.closest('.carousel-dot'));
                if (i >= 0) goTo(i);
            });
            thumbs.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-index]');
                if (btn) goTo(parseInt(btn.dataset.index, 10));
            });

            // Swipe mobile
            let startX = null;
            track.addEventListener('touchstart', e => startX = e.touches[0].clientX, { passive: true });
            track.addEventListener('touchend', e => {
                if (startX === null) return;
                const dx = e.changedTouches[0].clientX - startX; startX = null;
                if (Math.abs(dx) > 40) { dx > 0 ? goTo(index - 1) : goTo(index + 1); }
            });

            // init
            update();
        })();

    </script>

    <script>
        (function () {
            // Lire l'id dans l'URL
            const params = new URLSearchParams(location.search);
            const mocId = params.get('id');

            // Données
            const PROJECTS = (window.PROJECTS || window.project || []);
            const DETAILS = (window.dataDetails || []);

            const p = (Array.isArray(PROJECTS) ? PROJECTS : []).find(x => x.id === mocId) || {};
            const d = (Array.isArray(DETAILS) ? DETAILS : []).find(x => x.id === mocId) || {};

            // --- LOGIQUE VIDÉO ---
            const video = d.video || p.video || "";
            const vf = document.getElementById("video-frame");
            const sectionVideo = document.querySelector(".project-video");

            if (video && vf) {
                vf.src = video;                 // <- on alimente l’iframe
            } else if (sectionVideo) {
                sectionVideo.style.display = "none";  // <- on masque si pas de vidéo
            }
        })();
    </script>



</body>

</html>
