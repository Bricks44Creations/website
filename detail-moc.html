<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOC | Bricks Creations</title>
    <link rel="icon" type="image/png" href="img/logo_actuel.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>
    <!-- PAGE HEADER -->


    <!-- ===== MAIN (même structure que witches-road.html) ===== -->
    <div class="main-content project-page">
        <div class="title">
            <h1 id="page-title">Titre</h1>
        </div>

        <div class="separator"></div>

        <!-- HERO: image principale + encart références -->
        <section class="project-hero" aria-label="Présentation du projet">
            <section class="project-gallery" aria-label="Galerie d'images">
                <div class="carousel" aria-roledescription="carrousel">
                    <div class="carousel-track" id="carouselTrack"></div>
                    <div class="carousel-dots" id="carouselDots" aria-hidden="true"></div>
                </div>
                <div class="thumbs" id="thumbs"></div>
            </section>

            <!-- ASIDE TABS -->
            <aside class="project-aside" aria-label="Infos & médias">

                <!-- panneaux (remplis dynamiquement selon la data) -->
                <!-- entête des onglets -->
                <div class="tabs" id="asideTabs" role="tablist" aria-label="Onglets détails"></div>
                <!-- Référence -->
                <section id="tab-ref" class="tabpanel" role="tabpanel" aria-labelledby="tabbtn-ref" hidden>
                    <h3 class="meta-title" data-key="tab_ref"></h3>
                    <div class="ref-image">
                        <img id="ref-img" alt="Image de référence">
                    </div>
                    <div class="meta-grid" id="meta-grid"></div>
                </section>

                <!-- 3D -->
                <section id="tab-3d" class="tabpanel" role="tabpanel" aria-labelledby="tabbtn-3d" hidden>
                    <model-viewer src="" alt="" shadow-intensity="1" shadow-softness="0.5" camera-controls
                        exposure="1.2">
                    </model-viewer>
                </section>

                <!-- Vidéo -->
                <section id="tab-video" class="tabpanel" role="tabpanel" aria-labelledby="tabbtn-video" hidden>
                    <div class="video-wrapper">
                        <iframe id="video-iframe" src="" title="Vidéo" frameborder="0" allowfullscreen></iframe>
                    </div>
                </section>

                <!-- Notice -->
                <section id="tab-notice" class="tabpanel" role="tabpanel" aria-labelledby="tabbtn-notice" hidden>

                    <!-- 👇 Visualiseur PDF intégré -->
                    <div class="pdf-viewer" id="notice-viewer" hidden>
                        <iframe id="notice-iframe" title="Notice PDF" loading="lazy"></iframe>
                    </div>
                </section>
            </aside>

        </section>

        <!-- DESCRIPTION -->
        <section class="project-description">
            <h2>Description</h2>
            <p id="desc"></p>
        </section>
    </div>

    <!-- FOOTER -->


    <!-- SCRIPT -->
    <script src="js/data-detail.js"></script>
    <script src="js/data.js"></script>
    <script src="js/Generator.js"></script>
    <script src="js/script.js"></script>
    <!-- =========================================================
     SCRIPT PRINCIPAL — Hydratation contrôlée (un seul onglet visible)
     ========================================================= -->
    <script>
        (function () {
            // ----- [A] Utilitaires & contexte -----
            const $ = (s) => document.querySelector(s);
            const curLang = (window.currentLang || 'fr');
            const params = new URLSearchParams(location.search);
            const mocId = params.get('id');

            // ----- [B] Données -----
            const PROJECTS = (window.PROJECTS || window.project || []);
            const DETAILS = (window.dataDetails || []);
            const p = PROJECTS.find(x => x.id === mocId) || {};
            const d = DETAILS.find(x => x.id === mocId) || {};
            const data = Object.assign({}, p, d);

            // ----- [C] Titre & description -----
            const title =
                (p.name && (p.name[curLang] || p.name.en || p.name.fr)) ||
                (d.title && (d.title[curLang] || d.title.en || d.title.fr)) ||
                (mocId || '');
            $('#page-title').textContent = title;

            const desc = (d.description && (d.description[curLang] || d.description.en || d.description.fr)) || '';
            $('#desc').textContent = desc;
            const descSection = $('.project-description');
            if (!desc.trim() && descSection) descSection.style.display = 'none';

            // ----- [D] Galerie / carrousel -----
            const gallery = (d.images && Array.isArray(d.images.gallery)) ? d.images.gallery : [];
            const track = $('#carouselTrack');
            const dots = $('#carouselDots');
            const thumbs = $('#thumbs');

            if (track) {
                track.innerHTML = gallery.map(g => `
        <div class="carousel-slide">
          <img src="${g.src}" alt="${title} - ${g.caption || ''}"/>
        </div>
      `).join('');
            }
            if (thumbs) {
                thumbs.innerHTML = gallery.map((g, i) => `
        <button ${i === 0 ? 'class="active"' : ''} data-index="${i}">
          <img src="${g.src}" alt="Miniature ${i + 1}"/>
        </button>
      `).join('');
            }
            if (dots) {
                dots.innerHTML = gallery.map((_, i) => `
        <button class="carousel-dot ${i === 0 ? 'active' : ''}" aria-label="Aller à l'image ${i + 1}"></button>
      `).join('');
            }

            let index = 0;
            function keepActiveThumbVisible() {
                const container = thumbs;
                const active = container?.querySelector('button.active');
                if (!container || !active) return;
                const cRect = container.getBoundingClientRect();
                const bRect = active.getBoundingClientRect();
                const pad = 8;
                if (bRect.left < cRect.left) container.scrollBy({ left: bRect.left - cRect.left - pad, behavior: 'smooth' });
                else if (bRect.right > cRect.right) container.scrollBy({ left: bRect.right - cRect.right + pad, behavior: 'smooth' });
            }
            function updateCarousel() {
                if (track) track.style.transform = `translateX(-${index * 100}%)`;
                dots?.querySelectorAll('.carousel-dot').forEach((b, i) => b.classList.toggle('active', i === index));
                thumbs?.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === index));
                keepActiveThumbVisible();
            }
            function goTo(i) { index = (i + gallery.length) % gallery.length; updateCarousel(); }
            dots?.addEventListener('click', (e) => {
                const i = [...dots.children].indexOf(e.target.closest('.carousel-dot'));
                if (i >= 0) goTo(i);
            });
            thumbs?.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-index]');
                if (btn) goTo(parseInt(btn.dataset.index, 10));
            });
            updateCarousel();

            // ----- [E] Système d’onglets (lazy-hydrate, un seul visible) -----
            const tabsBar = document.getElementById('asideTabs');
            const t = (k) => (window.translations?.[window.currentLang || 'en']?.[k] || k);


            // Création bouton d’onglet
            const mkBtn = (id, key) => {
                const b = document.createElement('button');
                b.id = `tabbtn-${id}`;
                b.setAttribute('role', 'tab');
                b.setAttribute('aria-controls', `tab-${id}`);
                b.setAttribute('data-key', key); // important pour la traduction
                return b;
            };

            // Enregistreurs d’hydratation (une fois par panneau)
            const hydrated = new Set();
            const hydrators = {
                ref: () => {
                    const refImgEl = document.getElementById('ref-img');
                    const metaGrid = document.getElementById('meta-grid');
                    if (refImgEl) {
                        refImgEl.src = d.images.reference;
                        refImgEl.alt = `${title} — référence`;
                    }
                    const rows = [];
                    if (d.locations) rows.push({ icon: 'bx bx-map', key: 'ref_location', val: d.locations });
                    if (p.movie) rows.push({ icon: 'bx bx-film', key: 'ref_movie', val: p.movie });
                    if (d.characters) rows.push({ icon: 'bx bx-user', key: 'ref_characters', val: d.characters });
                    if (metaGrid) {
                        metaGrid.innerHTML = rows.map(r => `
  <div class="meta-row">
    <i class="${r.icon}"></i>
    <span class="meta-key" data-key="${r.key}"></span>
    <span>${r.val || '-'}</span>
  </div>
`).join('');
                    }
                },
                "3d": () => {
                    const panel = document.getElementById('tab-3d');
                    const mv = panel?.querySelector('model-viewer');
                    if (mv) {
                        mv.src = d.model3d;
                        mv.alt = title || 'Model 3D';
                    }
                },
                video: () => {
                    const v = document.getElementById('video-iframe');
                    if (v) v.src = d.video;
                },
                notice: () => {
                    const noticePdf = d.instructions || data.instructions || d.link || data.link || '';
                    const noticeTab = document.getElementById('tab-notice');
                    let viewer = document.getElementById('notice-viewer');
                    let frame = document.getElementById('notice-iframe');
                    if (!viewer && noticeTab) {
                        viewer = document.createElement('div');
                        viewer.id = 'notice-viewer';
                        viewer.className = 'pdf-viewer';
                        viewer.hidden = true;
                        frame = document.createElement('iframe');
                        frame.id = 'notice-iframe';
                        frame.title = 'Notice PDF';
                        frame.setAttribute('loading', 'lazy');
                        viewer.appendChild(frame);
                        noticeTab.appendChild(viewer);
                    }
                    if (noticePdf && frame && viewer) {
                        frame.src = `${noticePdf}#view=FitH`;
                        viewer.hidden = false;
                    }
                }
            };

            // Affiche un seul panneau, hydrate si nécessaire
            const showTab = (idToShow) => {
                // Cache tous les panneaux
                document.querySelectorAll('.tabpanel').forEach(p => { p.hidden = true; });
                // Active le bouton sélectionné
                document.querySelectorAll('.tabs [role="tab"]').forEach(btn => {
                    const on = btn.id === `tabbtn-${idToShow}`;
                    btn.setAttribute('aria-selected', on ? 'true' : 'false');
                    btn.tabIndex = on ? 0 : -1;
                });
                // Hydrate au premier affichage
                if (!hydrated.has(idToShow)) {
                    hydrators[idToShow]?.();
                    hydrated.add(idToShow);
                }
                // Affiche uniquement le panneau demandé
                const panel = document.getElementById(`tab-${idToShow}`);
                if (panel) panel.hidden = false;
            };

            // Détection des panneaux disponibles
            const hasRef = Boolean(d?.images?.reference);
            const hasVideo = typeof d?.video === 'string' && d.video.trim() !== '';
            const has3D = typeof d?.model3d === 'string' && d.model3d.trim() !== '';
            const hasNotice = Boolean(d?.images?.notice || d?.instructions || data?.instructions || data?.link || d?.link);

            const wanted = [];
            if (hasRef) wanted.push({ id: 'ref', key: 'tab_ref' });
            if (has3D) wanted.push({ id: '3d', key: 'tab_3d' });
            if (hasVideo) wanted.push({ id: 'video', key: 'tab_video' });
            if (hasNotice) wanted.push({ id: 'notice', key: 'tab_notice' });


            // Si aucun panneau : on retire l’aside et on étend la galerie
            if (wanted.length === 0) {
                const aside = document.querySelector('.project-aside');
                const hero = document.querySelector('.project-hero');
                aside?.remove();
                hero?.classList.add('no-meta');
                return;
            }

            // Prépare l’état initial (tous cachés par défaut via hidden dans le HTML)
            document.querySelectorAll('.tabpanel').forEach(p => p.hidden = true);

            // Barre d’onglets (un seul visible à la fois)
            if (wanted.length === 1) {
                document.querySelector('.tabs').style.display = 'none';
                showTab(wanted[0].id);
            } else {
                tabsBar.innerHTML = '';
                wanted.forEach((w, i) => {
                    const btn = mkBtn(w.id, w.key);
                    btn.addEventListener('click', () => showTab(w.id));
                    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
                    btn.tabIndex = i === 0 ? 0 : -1;
                    tabsBar.appendChild(btn);
                });
                showTab(wanted[0].id); // ← n’affiche que le premier
            }
        })();
    </script>

    <!-- =========================================================
     SCRIPT UTILITAIRE — Hauteur uniforme des panneaux
     ========================================================= -->
    <script>
        function equalizeTabHeights() {
            const tabs = document.querySelectorAll('.tabpanel');
            let maxHeight = 0;
            tabs.forEach(tab => {
                tab.style.height = 'auto';
                if (!tab.hasAttribute('hidden')) {
                    const h = tab.offsetHeight;
                    if (h > maxHeight) maxHeight = h;
                }
            });
            tabs.forEach(tab => tab.style.minHeight = (maxHeight || 0) + 'px');
        }
        window.addEventListener('load', equalizeTabHeights);
        window.addEventListener('resize', equalizeTabHeights);
        // Optionnel : ré-égaliser quand on change d’onglet
        document.addEventListener('click', (e) => {
            if (e.target?.getAttribute?.('role') === 'tab') {
                setTimeout(equalizeTabHeights, 0);
            }
        });
    </script>

    <!-- =========================================================
     DÉPENDANCE 3D — Import unique de model-viewer
     ========================================================= -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js">
    </script>

    <script>
        (function () {
            const sel = {
                header: '.header',                                   // adapte si besoin
                title: '.main-content .title',
                sep: '.main-content .separator',
                wrap: '.hero-scale-wrap',
                hero: '.hero-scale-wrap .project-hero'
            };

            function measureOffset() {
                const h = document.querySelector(sel.header)?.offsetHeight || 0;
                const t = document.querySelector(sel.title)?.offsetHeight || 0;
                const s = document.querySelector(sel.sep)?.offsetHeight || 0;
                return h + t + s + 12;   // petite marge de confort
            }

            function fitHero() {
                const wrap = document.querySelector(sel.wrap);
                const hero = document.querySelector(sel.hero);
                if (!wrap || !hero) return;

                // Désactiver l’échelle si on est déjà en 1 colonne (CSS @media)
                const twoCols = window.matchMedia('(min-width:1064px)').matches;
                if (!twoCols) {
                    hero.style.transform = '';
                    wrap.style.height = '';
                    wrap.classList.remove('fit');
                    return;
                }

                // tailles naturelles (non-scalées)
                hero.style.transform = 'none';
                wrap.style.height = 'auto';

                const offsetTop = measureOffset();
                const availH = Math.max(0, window.innerHeight - offsetTop);
                const availW = document.documentElement.clientWidth; // largeur viewport

                const naturalH = hero.offsetHeight;
                const naturalW = hero.offsetWidth;

                // marges latérales déjà gérées par .project-page (5–10%) :contentReference[oaicite:3]{index=3}
                const scaleH = availH > 0 ? (availH / naturalH) : 1;
                const scaleW = availW > 0 ? (availW / naturalW) : 1;

                const s = Math.min(scaleH, scaleW, 1);  // ≤ 1, jamais d’agrandissement

                if (s < 1) {
                    hero.style.transform = `scale(${s})`;
                    // Réserver la bonne hauteur dans le flux pour que ce soit cliquable partout
                    wrap.style.height = `${availH}px`; // au lieu de naturalH * s
                    wrap.classList.add('fit');
                } else {
                    hero.style.transform = '';
                    wrap.style.height = '';
                    wrap.classList.remove('fit');
                }
            }

            window.addEventListener('load', fitHero, { once: true });
            window.addEventListener('resize', fitHero);
        })();
    </script>


</body>

</html>
