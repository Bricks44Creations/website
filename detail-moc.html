<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOC | Bricks Creations</title>
    <link rel="icon" type="image/png" href="img/logo_actuel.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<style>
    model-viewer {
        width: 100%;
        height: 100%;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
</style>
</head>

<body>
    <!-- PAGE HEADER -->


    <!-- ===== MAIN (même structure que witches-road.html) ===== -->
    <div class="main-content project-page">
        <div class="title">
            <h1 id="page-title">Titre</h1>
        </div>

        <div class="separator"></div>

        <!-- HERO: image principale + encart références -->
        <section class="project-hero" aria-label="Présentation du projet">
            <section class="project-gallery" aria-label="Galerie d'images">
                <div class="carousel" aria-roledescription="carrousel">
                    <div class="carousel-track" id="carouselTrack"></div>
                    <div class="carousel-dots" id="carouselDots" aria-hidden="true"></div>
                </div>
                <div class="thumbs" id="thumbs"></div>
            </section>

            <!-- ASIDE TABS -->
            <aside class="project-aside" aria-label="Infos & médias">

                <!-- panneaux (remplis dynamiquement selon la data) -->
                <!-- entête des onglets -->
                <div class="tabs" id="asideTabs" role="tablist" aria-label="Onglets détails"></div>
                <!-- Référence -->
                <section id="tab-ref" class="tabpanel" role="tabpanel" aria-labelledby="tabbtn-ref" hidden>
                    <h3 class="meta-title">Références</h3>
                    <div class="ref-image">
                        <img id="ref-img" alt="Image de référence">
                    </div>
                    <div class="meta-grid" id="meta-grid"></div>
                </section>

                <!-- 3D -->
                <section id="tab-3d" class="tabpanel" role="tabpanel" aria-labelledby="tabbtn-3d" hidden>
                    <model-viewer src="" alt="" shadow-intensity="1" shadow-softness="0.5" camera-controls
                        exposure="1.2">
                    </model-viewer>
                </section>

                <!-- Vidéo -->
                <section id="tab-video" class="tabpanel" role="tabpanel" aria-labelledby="tabbtn-video" hidden>
                    <div class="video-wrapper">
                        <iframe id="video-iframe" src="" title="Vidéo" frameborder="0" allowfullscreen></iframe>
                    </div>
                </section>

                <!-- Notice -->
                <section id="tab-notice" class="tabpanel" role="tabpanel" aria-labelledby="tabbtn-notice" hidden>

                    <!-- 👇 Visualiseur PDF intégré -->
                    <div class="pdf-viewer" id="notice-viewer" hidden>
                        <iframe id="notice-iframe" title="Notice PDF" loading="lazy"></iframe>
                    </div>
                </section>
            </aside>

        </section>


        <!-- DESCRIPTION -->
        <section class="project-description">
            <h2>Description</h2>
            <p id="desc"></p>
        </section>
    </div>

    <!-- DATA -->
    <script src="js/data-detail.js"></script>
    <script src="js/data.js"></script>
    <!-- UTILS (langue, menus, tri, etc.) -->
    <script src="js/Generator.js"></script>
    <script src="js/script.js"></script>

    <script>
        (function () {
            const $ = (s) => document.querySelector(s);
            const curLang = (window.currentLang || 'fr');
            const params = new URLSearchParams(location.search);
            const mocId = params.get('id');

            // Données (fusion p + d)
            const PROJECTS = (window.PROJECTS || window.project || []);
            const DETAILS = (window.dataDetails || []);
            const p = PROJECTS.find(x => x.id === mocId) || {};
            const d = DETAILS.find(x => x.id === mocId) || {};
            const data = Object.assign({}, p, d); // fusion

            // ----- TITRE + DESCRIPTION -----
            const title =
                (p.name && (p.name[curLang] || p.name.en || p.name.fr)) ||
                (d.title && (d.title[curLang] || d.title.en || d.title.fr)) ||
                (mocId || '');
            $('#page-title').textContent = title;

            const desc = (d.description && (d.description[curLang] || d.description.en || d.description.fr)) || '';
            $('#desc').textContent = desc;
            const descSection = document.querySelector('.project-description');
            if (!desc.trim() && descSection) descSection.style.display = 'none';

            // ----- GALERIE / CARROUSEL -----
            const gallery = (d.images && Array.isArray(d.images.gallery)) ? d.images.gallery : [];
            const track = $('#carouselTrack');
            const dots = $('#carouselDots');
            const thumbs = $('#thumbs');

            if (track) {
                track.innerHTML = gallery.map(g => `
      <div class="carousel-slide"><img src="${g.src}" alt="${title} - ${g.caption || ''}"/></div>
    `).join('');
            }

            if (thumbs) {
                thumbs.innerHTML = gallery.map((g, i) => `
      <button ${i === 0 ? 'class="active"' : ''} data-index="${i}">
        <img src="${g.src}" alt="Miniature ${i + 1}"/>
      </button>
    `).join('');
            }

            if (dots) {
                dots.innerHTML = gallery.map((_, i) => `
      <button class="carousel-dot ${i === 0 ? 'active' : ''}" aria-label="Aller à l'image ${i + 1}"></button>
    `).join('');
            }

            let index = 0;
            function keepActiveThumbVisible() {
                const container = thumbs;
                const active = container?.querySelector('button.active');
                if (!container || !active) return;
                const cRect = container.getBoundingClientRect();
                const bRect = active.getBoundingClientRect();
                const pad = 8;
                if (bRect.left < cRect.left) {
                    container.scrollBy({ left: bRect.left - cRect.left - pad, behavior: 'smooth' });
                } else if (bRect.right > cRect.right) {
                    container.scrollBy({ left: bRect.right - cRect.right + pad, behavior: 'smooth' });
                }
            }
            function updateCarousel() {
                if (track) track.style.transform = `translateX(-${index * 100}%)`;
                dots?.querySelectorAll('.carousel-dot').forEach((b, i) => b.classList.toggle('active', i === index));
                thumbs?.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === index));
                keepActiveThumbVisible();
            }
            function goTo(i) { index = (i + gallery.length) % gallery.length; updateCarousel(); }

            dots?.addEventListener('click', (e) => {
                const i = [...dots.children].indexOf(e.target.closest('.carousel-dot'));
                if (i >= 0) goTo(i);
            });
            thumbs?.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-index]');
                if (btn) goTo(parseInt(btn.dataset.index, 10));
            });
            updateCarousel();

            // ========== ASIDE EN ONGLETS ==========
            const tabsBar = document.getElementById('asideTabs');
            const mkBtn = (id, label) => {
                const b = document.createElement('button');
                b.id = `tabbtn-${id}`;
                b.setAttribute('role', 'tab');
                b.setAttribute('aria-controls', `tab-${id}`);
                b.textContent = label;
                return b;
            };
            const showTab = (idToShow) => {
                document.querySelectorAll('.tabs [role="tab"]').forEach(btn => {
                    const on = btn.id === `tabbtn-${idToShow}`;
                    btn.setAttribute('aria-selected', on ? 'true' : 'false');
                    btn.tabIndex = on ? 0 : -1;
                });
                document.querySelectorAll('.tabpanel').forEach(p => {
                    p.hidden = (p.id !== `tab-${idToShow}`);
                });
            };

            // Quelles sections existent ?
            const hasRef = Boolean(d?.images?.reference);
            const hasVideo = typeof d?.video === 'string' && d.video.trim() !== '';
            const has3D = typeof d?.model3d === 'string' && d.model3d.trim() !== '';
            const hasNotice = Boolean(d?.images?.notice || d?.instructions);

            // Onglets à créer dynamiquement
            const wanted = [];
            if (hasRef) wanted.push({ id: 'ref', label: 'Référence' });
            if (has3D) wanted.push({ id: '3d', label: '3D' });
            if (hasVideo) wanted.push({ id: 'video', label: 'Vidéo' });
            if (hasNotice) wanted.push({ id: 'notice', label: 'Notice' });

            if (wanted.length === 0) {
                const aside = document.querySelector('.project-aside');
                const hero = document.querySelector('.project-hero');
                aside?.remove();
                hero?.classList.add('no-meta');
                return; // rien à hydrater
            }

            if (wanted.length === 1) {
                document.querySelector('.tabs').style.display = 'none';
                showTab(wanted[0].id);
            } else {
                tabsBar.innerHTML = '';
                wanted.forEach((w, i) => {
                    const btn = mkBtn(w.id, w.label);
                    btn.addEventListener('click', () => showTab(w.id));
                    if (i === 0) { btn.setAttribute('aria-selected', 'true'); btn.tabIndex = 0; }
                    else { btn.setAttribute('aria-selected', 'false'); btn.tabIndex = -1; }
                    tabsBar.appendChild(btn);
                });
                showTab(wanted[0].id);
            }

            // ----- RÉFÉRENCE -----
            if (hasRef) {
                const refImgEl = document.getElementById('ref-img');
                const metaGrid = document.getElementById('meta-grid');
                if (refImgEl) {
                    refImgEl.src = d.images.reference;
                    refImgEl.alt = `${title} — référence`;
                }
                const rows = [];
                if (d.locations) rows.push({ icon: 'bx bx-map', key: 'Location :', val: d.locations });
                if (p.filter) rows.push({ icon: 'bx bx-film', key: 'Movie :', val: p.filter });
                if (d.characters) rows.push({ icon: 'bx bx-user', key: 'Characters :', val: d.characters });
                if (metaGrid) {
                    metaGrid.innerHTML = rows.map(r => `
        <div class="meta-row">
          <i class="${r.icon}"></i>
          <span class="meta-key">${r.key}</span>
          <span>${r.val || '-'}</span>
        </div>`).join('');
                }
                document.getElementById('tab-ref').hidden = false;
            }

            // ----- 3D -----
            if (has3D) {
                const panel = document.getElementById('tab-3d');
                const mv = panel?.querySelector('model-viewer');
                if (mv) {
                    mv.src = d.model3d;          // <-- vient de data-detail.js
                    mv.alt = title || 'Model 3D';
                    // options utiles (facultatives) :
                    // mv.setAttribute('shadow-intensity', '0.8');
                    // mv.setAttribute('ar', ''); // active AR sur mobile compatible
                }
                panel.hidden = false;
            }

            // ----- VIDÉO -----
            if (hasVideo) {
                const v = document.getElementById('video-iframe');
                if (v) {
                    v.src = d.video;
                    document.getElementById('tab-video').hidden = false;
                }
            }

            // ----- NOTICE + LECTEUR PDF -----
            if (hasNotice) {
                const nThumb = document.getElementById('notice-thumb');
                const nLink = document.getElementById('notice-download');

                // Miniature: priorité notice -> référence -> image principale
                const noticeThumb = d.images?.notice || d.images?.reference || p.img || '';
                if (nThumb && noticeThumb) nThumb.src = noticeThumb;

                // Lien de téléchargement: priorité au PDF d'instructions
                const noticePdf = d.instructions || data.instructions || d.link || data.link || '';
                if (nLink) {
                    if (noticePdf) nLink.href = noticePdf;
                    else if (d?.images?.notice) nLink.href = d.images.notice;
                    else nLink.removeAttribute('href');
                }

                // Lecteur PDF intégré, injecté si non présent dans le HTML
                const noticeTab = document.getElementById('tab-notice');
                let viewer = document.getElementById('notice-viewer');
                let frame = document.getElementById('notice-iframe');

                if (!viewer && noticeTab) {
                    viewer = document.createElement('div');
                    viewer.id = 'notice-viewer';
                    viewer.className = 'pdf-viewer';
                    viewer.hidden = true;
                    frame = document.createElement('iframe');
                    frame.id = 'notice-iframe';
                    frame.title = 'Notice PDF';
                    frame.setAttribute('loading', 'lazy');
                    viewer.appendChild(frame);
                    noticeTab.appendChild(viewer);
                }

                if (noticePdf && frame && viewer) {
                    // charge le PDF directement, ajusté en largeur
                    frame.src = `${noticePdf}#view=FitH`;
                    viewer.hidden = false;
                }

                document.getElementById('tab-notice').hidden = false;
            }
        })();
    </script>


    <script>
        (function () {
            const $ = (s) => document.querySelector(s);
            const curLang = (window.currentLang || 'fr');
            const params = new URLSearchParams(location.search);
            const mocId = params.get('id');

            // Données
            const PROJECTS = (window.PROJECTS || window.project || []);
            const DETAILS = (window.dataDetails || []);
            const p = PROJECTS.find(x => x.id === mocId) || {};
            const d = DETAILS.find(x => x.id === mocId) || {};
            const data = Object.assign({}, p, d); // fusion

            // -- Titre + description (inchangé)
            const title =
                (p.name && (p.name[curLang] || p.name.en || p.name.fr)) ||
                (d.title && (d.title[curLang] || d.title.en || d.title.fr)) ||
                (mocId || '');
            $('#page-title').textContent = title;

            const desc = (d.description && (d.description[curLang] || d.description.en || d.description.fr)) || '';
            $('#desc').textContent = desc;
            const descSection = document.querySelector('.project-description');
            if (!desc.trim() && descSection) descSection.style.display = 'none';

            // -- Galerie / carrousel (laisse ton code existant ici)
            // (… ton code carrousel / thumbs / dots reste tel quel …)

            // ========== ASIDE EN ONGLETS ==========
            const tabsBar = document.getElementById('asideTabs');
            const mkBtn = (id, label) => {
                const b = document.createElement('button');
                b.id = `tabbtn-${id}`;
                b.setAttribute('role', 'tab');
                b.setAttribute('aria-controls', `tab-${id}`);
                b.textContent = label;
                return b;
            };
            const showTab = (idToShow) => {
                document.querySelectorAll('.tabs [role="tab"]').forEach(btn => {
                    const on = btn.id === `tabbtn-${idToShow}`;
                    btn.setAttribute('aria-selected', on ? 'true' : 'false');
                    btn.tabIndex = on ? 0 : -1;
                });
                document.querySelectorAll('.tabpanel').forEach(p => {
                    p.hidden = (p.id !== `tab-${idToShow}`);
                });
            };

            // Quelles sections existent ?
            const hasRef = Boolean(d?.images?.reference);
            const hasVideo = typeof d?.video === 'string' && d.video.trim() !== '';
            const has3D = typeof d?.model3d === 'string' && d.model3d.trim() !== '';     // <— optionnel si tu ajoutes model3d
            const hasNotice = Boolean(d?.images?.notice || d?.instructions);

            // Onglets à créer dynamiquement
            const wanted = [];
            if (hasRef) wanted.push({ id: 'ref', label: 'Référence' });
            if (has3D) wanted.push({ id: '3d', label: '3D' });
            if (hasVideo) wanted.push({ id: 'video', label: 'Vidéo' });
            if (hasNotice) wanted.push({ id: 'notice', label: 'Notice' });

            // Si aucune data côté meta
            if (wanted.length === 0) {
                const aside = document.querySelector('.project-aside');
                const hero = document.querySelector('.project-hero');
                if (aside) aside.remove();
                if (hero) hero.classList.add('no-meta');
            }
            // S’il n’y a qu’UNE seule section -> on la montre sans boutons
            else if (wanted.length === 1) {
                document.querySelector('.tabs').style.display = 'none';
                showTab(wanted[0].id); // affiche directement la seule section
            }
            // Cas normal : 2+ onglets -> navigation
            else {
                tabsBar.innerHTML = '';
                wanted.forEach((w, i) => {
                    const btn = mkBtn(w.id, w.label);
                    btn.addEventListener('click', () => showTab(w.id));
                    if (i === 0) { btn.setAttribute('aria-selected', 'true'); btn.tabIndex = 0; }
                    else { btn.setAttribute('aria-selected', 'false'); btn.tabIndex = -1; }
                    tabsBar.appendChild(btn);
                });
                showTab(wanted[0].id);
            }

            // Si aucune data côté meta (cas rare), enlève l’aside et étends la galerie
            if (wanted.length === 0) {
                const aside = document.querySelector('.project-aside');
                const hero = document.querySelector('.project-hero');
                if (aside) aside.remove();
                if (hero) hero.classList.add('no-meta');  // déjà stylé dans ton CSS
            } else {
                // Boutons
                tabsBar.innerHTML = '';
                wanted.forEach((w, i) => {
                    const btn = mkBtn(w.id, w.label);
                    btn.addEventListener('click', () => showTab(w.id));
                    if (i === 0) { btn.setAttribute('aria-selected', 'true'); btn.tabIndex = 0; }
                    else { btn.setAttribute('aria-selected', 'false'); btn.tabIndex = -1; }
                    tabsBar.appendChild(btn);
                });

                // Panneaux - hydrate chacun seulement s’il existe
                if (hasRef) {
                    const refImgEl = document.getElementById('ref-img');
                    const metaGrid = document.getElementById('meta-grid');
                    if (refImgEl) {
                        refImgEl.src = d.images.reference;
                        refImgEl.alt = `${title} — référence`;
                    }
                    const rows = [];
                    if (d.locations) rows.push({ icon: 'bx bx-map', key: 'Location :', val: d.locations });
                    if (p.filter) rows.push({ icon: 'bx bx-film', key: 'Movie :', val: p.filter });
                    if (d.characters) rows.push({ icon: 'bx bx-user', key: 'Characters :', val: d.characters });
                    if (metaGrid) {
                        metaGrid.innerHTML = rows.map(r => `
          <div class="meta-row">
            <i class="${r.icon}"></i>
            <span class="meta-key">${r.key}</span>
            <span>${r.val || '-'}</span>
          </div>`).join('');
                    }
                    document.getElementById('tab-ref').hidden = false; // sera visible si onglet actif
                }

                if (has3D) {
                    const iframe3d = document.getElementById('iframe-3d');
                    iframe3d.src = d.model3d; // ex: URL Sketchfab en embed
                    document.getElementById('tab-3d').hidden = false;
                }

                if (hasVideo) {
                    const v = document.getElementById('video-iframe');
                    v.src = d.video;
                    document.getElementById('tab-video').hidden = false;
                }

                if (hasNotice) {
                    const nThumb = document.getElementById('notice-thumb');
                    const nLink = document.getElementById('notice-download');
                    if (d?.images?.notice) nThumb.src = d.images.notice;
                    // Priorité à un vrai PDF d’instructions si présent
                    if (d.instructions) {
                        nLink.href = d.instructions;
                    } else if (d?.images?.notice) {
                        nLink.href = d.images.notice;
                    } else {
                        nLink.removeAttribute('href');
                    }
                    document.getElementById('tab-notice').hidden = false;
                }

                // onglet initial = 1er existant
                showTab(wanted[0].id);
            }
        })();
    </script>

    <script>
        function equalizeTabHeights() {
            const tabs = document.querySelectorAll('.tabpanel');
            let maxHeight = 0;
            tabs.forEach(tab => {
                tab.style.height = 'auto'; // reset
                if (!tab.hasAttribute('hidden')) {
                    const h = tab.offsetHeight;
                    if (h > maxHeight) maxHeight = h;
                }
            });
            tabs.forEach(tab => tab.style.minHeight = maxHeight + 'px');
        }

        window.addEventListener('load', equalizeTabHeights);
        window.addEventListener('resize', equalizeTabHeights);
    </script>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

</body>

</html>
