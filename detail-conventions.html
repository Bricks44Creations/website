<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conventions | Bricks Creations</title>

    <link rel="icon" type="image/png" href="img/logo_actuel.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- HEADER  -->

    <div class="main-content project-page">
        <div class="title">
            <h1 id="page-title"></h1>
        </div>

        <div class="separator"></div>

        <!-- HERO: uniquement galerie (sans aside) -->
        <section class="project-hero no-aside" aria-label="Détails de la convention">
            <section class="project-gallery" aria-label="Galerie d'images">
                <div class="carousel" aria-roledescription="carrousel">
                    <button class="carousel-see-all" type="button">
                        <span>Tout voir</span>
                    </button>

                    <button class="carousel-btn prev" type="button" aria-label="Image précédente">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>

                    <button class="carousel-btn next" type="button" aria-label="Image suivante">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>

                    <div class="carousel-track" id="carouselTrack"></div>
                </div>

                <div class="thumbs" id="thumbs"></div>
            </section>
        </section>
    </div>

    <!-- SCRIPTS -->
    <script src="js/data-detail.js"></script>
    <script src="js/data.js"></script>
    <script src="js/Generator.js"></script>
    <script src="js/script.js"></script>
    <script src="js/translations.js"></script>

    <script>
        (function () {
            const $ = (sel) => document.querySelector(sel);

            // --- id depuis l'URL
            const params = new URLSearchParams(location.search);
            const expoId = params.get("id");

            const titleEl = document.querySelector("#page-title");

            // expoId = "bousies-2018" (ça c'est l'identifiant)
            const expo = (window.EXPO || []).find(e => e.id === expoId);

            if (!expo) {
                titleEl.textContent = "Convention introuvable";
            } else {
                titleEl.textContent = `${expo.city} ${expo.year}`;
            }

            // ------------------------------------------------------------
            // Galerie d'images
            // -> si tu ajoutes plus tard window.EXPO_GALLERIES, on l'utilise
            // -> sinon fallback sur l'affiche (poster)
            //
            // Format attendu:
            // window.EXPO_GALLERIES = {
            //   "bousies-2018": [
            //      { src:"img/Expo/bousies_affiche.png", caption:"Affiche" },
            //      { src:"img/Expo/Bousies/01.webp", caption:"Stand" },
            //   ],
            //   ...
            // }
            // ------------------------------------------------------------
            const galleries = window.EXPO_GALLERIES || {};
            const gallery = Array.isArray(galleries[expoId]) && galleries[expoId].length
                ? galleries[expoId]
                : [{ src: expo.poster, caption: "Affiche" }];

            // --- DOM
            const track = $("#carouselTrack");
            const thumbsEl = $("#thumbs");
            const btnPrev = $(".carousel-btn.prev");
            const btnNext = $(".carousel-btn.next");

            let index = 0;

            // --- render slides + thumbs
            track.innerHTML = gallery.map((g, i) => `
        <div class="carousel-slide" data-index="${i}">
          <img src="${g.src}" alt="${expo.city} ${expo.year} — ${g.caption || ("Photo " + (i + 1))}">
        </div>
      `).join("");

            thumbsEl.innerHTML = gallery.map((g, i) => `
        <button type="button" data-index="${i}" aria-label="Voir l'image ${i + 1}">
          <img src="${g.src}" alt="">
        </button>
      `).join("");

            function setActiveThumb(i) {
                thumbsEl.querySelectorAll("button").forEach(b => b.classList.remove("active"));
                const b = thumbsEl.querySelector(`button[data-index="${i}"]`);
                if (b) b.classList.add("active");
            }

            function updateCarousel() {
                const w = track.clientWidth; // 100% de la zone
                track.style.transform = `translateX(${-index * w}px)`;
                setActiveThumb(index);
            }

            function goTo(i) {
                const n = gallery.length;
                index = ((i % n) + n) % n;
                updateCarousel();
            }

            btnPrev?.addEventListener("click", () => goTo(index - 1));
            btnNext?.addEventListener("click", () => goTo(index + 1));

            thumbsEl.addEventListener("click", (e) => {
                const btn = e.target.closest("button[data-index]");
                if (!btn) return;
                goTo(parseInt(btn.dataset.index, 10));
            });

            // Resize: recalcul transform (sinon ça décale)
            window.addEventListener("resize", () => updateCarousel());

            // Init
            updateCarousel();

            // =========================
            // "Tout voir" = overlay (sheet) identique au principe moc-detail
            // =========================
            function ensureCarouselSheet() {
                let overlay = document.querySelector(".carousel-sheet-overlay");
                if (overlay) return overlay;

                overlay = document.createElement("div");
                overlay.className = "carousel-sheet-overlay";
                overlay.innerHTML = `
          <div class="carousel-sheet" role="dialog" aria-modal="true" aria-label="Galerie">
            <div class="carousel-sheet-header">
              <button class="carousel-sheet-close" type="button" aria-label="Fermer">×</button>
            </div>
            <div class="carousel-sheet-body"></div>
          </div>
        `;

                // fermer si clic sur le voile
                overlay.addEventListener("click", (e) => {
                    if (e.target === overlay) closeCarouselSheet();
                });

                overlay.querySelector(".carousel-sheet-close").addEventListener("click", closeCarouselSheet);

                // fermer avec ESC
                document.addEventListener("keydown", (e) => {
                    if (e.key === "Escape") closeCarouselSheet();
                });

                document.body.appendChild(overlay);
                return overlay;
            }

            function buildSheetContent(overlay, startIndex = 0) {
                const body = overlay.querySelector(".carousel-sheet-body");
                if (!body) return;

                // réordonne pour commencer par l’image cliquée
                const ordered = gallery.length
                    ? gallery.slice(startIndex).concat(gallery.slice(0, startIndex))
                    : [];

                // lignes alternées: 1 image, puis 2 images, puis 1, puis 2...
                const rows = [];
                let i = 0;
                let one = true;
                while (i < ordered.length) {
                    if (one) {
                        rows.push({ type: "one", imgs: [ordered[i]] });
                        i += 1;
                    } else {
                        rows.push({ type: "two", imgs: [ordered[i], ordered[i + 1]].filter(Boolean) });
                        i += 2;
                    }
                    one = !one;
                }

                body.innerHTML = rows.map(r => `
          <div class="carousel-sheet-row ${r.type}">
            ${r.imgs.map(g => `<img src="${g.src}" alt="${expo.city} ${expo.year}">`).join("")}
          </div>
        `).join("");
            }

            function openCarouselSheet(startIndex) {
                const overlay = ensureCarouselSheet();
                buildSheetContent(overlay, startIndex);

                document.body.style.overflow = "hidden";
                requestAnimationFrame(() => overlay.classList.add("is-open"));
            }

            function closeCarouselSheet() {
                const overlay = document.querySelector(".carousel-sheet-overlay");
                if (!overlay) return;

                overlay.classList.remove("is-open");
                setTimeout(() => {
                    document.body.style.overflow = "";
                }, 300);
            }

            // Bouton "Tout voir"
            const seeAllBtn = document.querySelector(".carousel-see-all");
            seeAllBtn?.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                openCarouselSheet(index || 0);
            });

            // Clic sur image du carrousel => ouvre overlay
            track?.addEventListener("click", (e) => {
                const slide = e.target.closest(".carousel-slide");
                if (!slide) return;
                openCarouselSheet(Number(slide.dataset.index));
            });

        })();


    </script>


</body>

</html>
