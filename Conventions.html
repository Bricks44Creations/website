<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conventions | Bricks Creations</title>

    <link rel="icon" type="image/png" href="img/logo_actuel.png">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Leaflet CSS (Carte)-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
        integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
        crossorigin="" />


    <!-- Google tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CGB36SQTVF"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-CGB36SQTVF');
    </script>
</head>

<body>
    <!-- HEADER -->

    <!-- CONTENU PRINCIPAL -->
    <div class="main-content">
        <div class="title">
            <h1 data-key="title_conventions"></h1>
        </div>
        <div class="separator"></div>

        <div class="left-right">
            <!-- Contrôles -->
            <div class="filter-bar">
                <!-- TRI PAR ANNÉE -->
                <div class="dropdown-tri" id="year-sort-dropdown">
                    <button id="year-sort-btn" class="dropbtn-tri">
                        <span id="year-sort-label" data-key="expo_sort_year_desc"></span>
                        <span class="arrow-down">&#9662;</span>
                    </button>
                    <div id="year-sort-options" class="dropdown-content-tri">
                        <a href="#" data-sort="year-desc" data-key="expo_sort_year_desc"></a>
                        <a href="#" data-sort="year-asc" data-key="expo_sort_year_asc"></a>
                    </div>
                </div>

                <!-- FILTRE VILLES -->

            </div>
            <!-- Modales mobile -->
            <div id="year-sort-modal" class="sort-modal">
                <div class="sort-modal-content">
                    <button class="close-sort-modal" aria-label="Fermer">×</button>
                    <a href="#" data-sort="year-desc" data-key="expo_sort_year_desc"></a>
                    <a href="#" data-sort="year-asc" data-key="expo_sort_year_asc"></a>
                </div>
            </div>

            <div id="city-filter-modal" class="sort-modal">
                <div class="sort-modal-content">
                    <button class="close-sort-modal" aria-label="Fermer">×</button>
                    <div id="city-filter-list" class="checkbox-list"></div>
                    <a href="#" id="city-reset" class="btn-clear"></a>
                    <a href="#" id="city-apply" class="btn-close"></a>
                </div>
            </div>

            <!-- Layout carte + cards -->
            <main class="layout expo-layout">
                <!-- Colonne gauche : carte -->
                <div class="panel map-wrap">
                    <div id="map"></div>
                </div>

                <!-- Colonne droite : cards expos -->
                <div class="panel-expo">
                    <div id="cards" class="cards cards_expo" aria-label="Liste des expositions"></div>
                </div>


            </main>
        </div>
    </div>

    <!-- FOOTER -->

    <!-- ===== Scripts (à garder dans l'ordre) ===== -->
    <script src="js/data.js"></script>
    <script src="js/Generator.js"></script>
    <script src="js/translations.js"></script>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
        integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
        crossorigin=""></script>
    <script src="js/script.js">

    </script>

</body>

</html>
